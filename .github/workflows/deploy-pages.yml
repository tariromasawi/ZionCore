name: ZionCore GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "zioncore-pages"
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout ZionCore
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          echo "ZionCore GitHub deployment"
          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"
          echo "Commit:"
          echo "${GITHUB_SHA}"

          test -f index.html
          test -f zioncore.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy ZionCore
        id: deployment
        uses: actions/deploy-pages@v4